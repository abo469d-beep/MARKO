<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الياقوت مستويات</title>
    <style>
        body {
            background-color: #0f111a;
            color: #ffffff;
            font-family: Tahoma, sans-serif;
            margin: 0;
            padding: 15px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #16192b;
            padding: 10px 15px;
            border-radius: 8px;
            margin-bottom: 15px;
        }
        .header h1 {
            color: #ff3366;
            font-size: 20px;
            margin: 0;
        }
        .discord-btn {
            background-color: #5865F2;
            color: white;
            padding: 6px 12px;
            border-radius: 5px;
            text-decoration: none;
            font-size: 13px;
        }
        .card {
            background-color: #1a1d2e;
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 10px;
            border: 1px solid #25283d;
            position: relative;
        }
        .top-1 { border-color: #ffaa00; }
        .top-2 { border-color: #aaaaaa; }
        .top-3 { border-color: #cd7f32; }
        
        .player-info {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
        }
        .rank-num {
            font-weight: bold;
            font-size: 16px;
            color: #ffaa00;
        }
        .name {
            font-size: 16px;
            font-weight: bold;
        }
        .details {
            font-size: 12px;
            color: #b8b8b8;
        }
        .badges {
            display: flex;
            gap: 5px;
            flex-wrap: wrap;
            border-top: 1px solid #25283d;
            padding-top: 8px;
        }
        .badge {
            background: #25283d;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 11px;
            color: #cccccc;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>الياقوت مستويات</h1>
        <a href="#" class="discord-btn">انضم إلى خادم الاختبار</a>
    </div>

    <!-- اللاعب الأول -->
    <div class="card top-1">
        <div class="player-info">
            <span class="rank-num">1.</span>
            <div>
                <div class="name">iRuby_X</div>
                <div class="details">(60 نقطة) متخصص قتالي</div>
            </div>
        </div>
        <div class="badges">
            <span class="badge">⚔️ HT1</span>
            <span class="badge">غير مصنف</span>
            <span class="badge">غير مصنف</span>
        </div>
    </div>

    <!-- اللاعب الثاني -->
    <div class="card top-2">
        <div class="player-info">
            <span class="rank-num">2.</span>
            <div>
                <div class="name">Mustfa_105</div>
                <div class="details">(42 نقطة) طالب عسكري قتالي</div>
            </div>
        </div>
        <div class="badges">
            <span class="badge">🛡️ LT3</span>
            <span class="badge">غير مصنف</span>
            <span class="badge">⚔️ HT3</span>
        </div>
    </div>

</body>
</html>
