<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MIKEY TIERS</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #0f1117;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .player-profile-card {
            background-color: #161922;
            border: 1px solid #232733;
            border-radius: 16px;
            padding: 22px 28px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
            width: fit-content;
        }

        .tier-list-bar {
            display: flex;
            align-items: center;
            gap: 16px;
            overflow-x: auto;
            padding: 5px 0;
        }

        .tier-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            min-width: 55px;
        }

        .icon-circle {
            width: 48px;
            height: 48px;
            background-color: #212533;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            border: 2px solid transparent;
        }

        .icon-circle img {
            width: 24px;
            height: 24px;
            filter: brightness(0.7);
        }

        .tier-text {
            font-size: 11px;
            color: #6b7280;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        /* تنسيق العنصر النشط (HT1) */
        .tier-item.active .icon-circle {
            border-color: #f59e0b;
            background-color: #262a3b;
            box-shadow: 0 0 12px rgba(245, 158, 11, 0.25);
        }

        .tier-item.active .icon-circle img {
            filter: brightness(1.2);
        }

        .tier-item.active .tier-text {
            color: #f59e0b;
        }
    </style>
</head>
<body>

    <div class="player-profile-card">
        <div class="tier-list-bar">
            
            <!-- SMP -->
            <div class="tier-item">
                <div class="icon-circle">
                    <img src="smp_2.svg" alt="SMP">
                </div>
                <span class="tier-text">غير مصنف</span>
            </div>

            <!-- UHC -->
            <div class="tier-item">
                <div class="icon-circle">
                    <img src="uhc.svg" alt="UHC">
                </div>
                <span class="tier-text">غير مصنف</span>
            </div>

            <!-- Pot -->
            <div class="tier-item">
                <div class="icon-circle">
                    <img src="pot (1).svg" alt="Pot">
                </div>
                <span class="tier-text">غير مصنف</span>
            </div>

            <!-- NethOP -->
            <div class="tier-item">
                <div class="icon-circle">
                    <img src="nethop.svg" alt="NethOP">
                </div>
                <span class="tier-text">غير مصنف</span>
            </div>

            <!-- Vanilla -->
            <div class="tier-item">
                <div class="icon-circle">
                    <img src="vanilla_2.svg" alt="Vanilla">
                </div>
                <span class="tier-text">غير مصنف</span>
            </div>

            <!-- Sword (HT1 Active) -->
            <div class="tier-item active">
                <div class="icon-circle">
                    <img src="sword_2.svg" alt="Sword">
                </div>
                <span class="tier-text">HT1</span>
            </div>

            <!-- Axe -->
            <div class="tier-item">
                <div class="icon-circle">
                    <img src="axe_2.svg" alt="Axe">
                </div>
                <span class="tier-text">غير مصنف</span>
            </div>

            <!-- Mace -->
            <div class="tier-item">
                <div class="icon-circle">
                    <img src="mace_2.svg" alt="Mace">
                </div>
                <span class="tier-text">غير مصنف</span>
            </div>

            <!-- Spear Mace -->
            <div class="tier-item">
                <div class="icon-circle">
                    <img src="spearmace_2.svg" alt="Spear Mace">
                </div>
                <span class="tier-text">غير مصنف</span>
            </div>

        </div>
    </div>

</body>
</html>
