<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MIKEY TIERS - Profile Tiers</title>
    <style>
        body {
            background-color: #0f1117;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .player-profile-card {
            background-color: #161922;
            border: 1px solid #232733;
            border-radius: 14px;
            padding: 20px 25px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.5);
            max-width: 100%;
        }

        .tier-list-bar {
            display: flex;
            align-items: center;
            gap: 16px;
            overflow-x: auto;
            padding: 5px 0;
        }

        .tier-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            min-width: 55px;
        }

        .icon-circle {
            width: 48px;
            height: 48px;
            background-color: #212533;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            border: 2px solid transparent;
        }

        .icon-circle img {
            width: 24px;
            height: 24px;
            filter: brightness(0.7);
            transition: filter 0.2s ease;
        }

        .tier-text {
            font-size: 11px;
            color: #6b7280;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        /* تنسيق العنصر النشط المحدد باللون الأصفر */
        .tier-item.active .icon-circle {
            border-color: #f59e0b;
            background-color: #262a3b;
            box-shadow: 0 0 12px rgba(245, 158, 11, 0.25);
        }

        .tier-item.active .icon-circle img {
            filter: brightness(1.2);
        }

        .tier-item.active .tier-text {
            color: #f59e0b;
        }
    </style>
</head>
<body>

    <div class="player-profile-card">
        <div class="tier-list-bar">
            <!-- Crystal / SMP -->
            <div class="tier-item">
                <div class="icon-circle">
                    <img src="smp_2.svg" alt="Crystal">
                </div>
                <span class="tier-text">Unranked</span>
            </div>

            <!-- UHC -->
            <div class="tier-item">
                <div class="icon-circle">
                    <img src="uhc.svg" alt="UHC">
                </div>
                <span class="tier-text">Unranked</span>
            </div>

            <!-- Pot -->
            <div class="tier-item">
                <div class="icon-circle">
                    <img src="pot (1).svg" alt="Pot">
                </div>
                <span class="tier-text">Unranked</span>
            </div>

            <!-- NethOP -->
            <div class="tier-item">
                <div class="icon-circle">
                    <img src="nethop.svg" alt="NethOP">
                </div>
                <span class="tier-text">Unranked</span>
            </div>

            <!-- Vanilla -->
            <div class="tier-item">
                <div class="icon-circle">
                    <img src="vanilla_2.svg" alt="Vanilla">
                </div>
                <span class="tier-text">Unranked</span>
            </div>

            <!-- Sword (Active / HT1) -->
            <div class="tier-item active">
                <div class="icon-circle">
                    <img src="sword_2.svg" alt="Sword">
                </div>
                <span class="tier-text">HT1</span>
            </div>

            <!-- Axe -->
            <div class="tier-item">
                <div class="icon-circle">
                    <img src="axe_2.svg" alt="Axe">
                </div>
                <span class="tier-text">Unranked</span>
            </div>

            <!-- Mace -->
            <div class="tier-item">
                <div class="icon-circle">
                    <img src="mace_2.svg" alt="Mace">
                </div>
                <span class="tier-text">Unranked</span>
            </div>

            <!-- Spear Mace -->
            <div class="tier-item">
                <div class="icon-circle">
                    <img src="spearmace_2.svg" alt="Spear Mace">
                </div>
                <span class="tier-text">Unranked</span>
            </div>
        </div>
    </div>

</body>
</html>
